name: release-gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  linux-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.13.1, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Load confined Worker AppArmor policy
        run: sudo apparmor_parser --replace --skip-cache deploy/worker-apparmor
      - run: npm run check:release
      - uses: actions/upload-artifact@v4
        with:
          name: release-qualification-${{ github.sha }}
          path: release-results/qualifications/*.json
          if-no-files-found: error
      - name: Report sandbox denials
        if: failure()
        continue-on-error: true
        run: sudo journalctl --dmesg --no-pager --grep='apparmor="DENIED"' --lines=30
