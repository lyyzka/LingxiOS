name: release-gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  linux-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.13.1, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Load confined Worker AppArmor policy
        run: sudo apparmor_parser --replace --skip-cache deploy/worker-apparmor
      - run: npm run check:release
      - name: Report sandbox denials
        if: failure()
        continue-on-error: true
        run: sudo journalctl --dmesg --no-pager --grep='apparmor="DENIED"' --lines=30

  windows-package:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.13.1, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm test
