 font-weight='bold' fill='#006064'>引导步骤\u003c/text>\u003ctext x='110' y='115' text-anchor='middle' font-size='14' fill='#006064'>7步 → 4步\u003c/text>\u003cline x1='200' y1='105' x2='260' y2='105' marker-end='url(#arrow)' stroke='#1a1a1a' stroke-width='2'/>\u003crect x='260' y='60' width='180' height='90' rx='10' fill='#fff3e0' stroke='#e65100' stroke-width='2'/>\u003ctext x='350' y='95' text-anchor='middle' font-size='16' font-weight='bold' fill='#e65100'>首次设置\u003c/text>\u003ctext x='350' y='115' text-anchor='middle' font-size='14' fill='#e65100'>流失减少\u003c/text>\u003cline x1='440' y1='105' x2='500' y2='105' marker-end='url(#arrow)' stroke='#1a1a1a' stroke-width='2'/>\u003crect x='500' y='60' width='180' height='90' rx='10' fill='#e8f5e9' stroke='#2e7d32' stroke-width='2'/>\u003ctext x='590' y='95' text-anchor='middle' font-size='16' font-weight='bold' fill='#2e7d32'>激活率\u003c/text>\u003ctext x='590' y='115' text-anchor='middle' font-size='14' fill='#2e7d32'>42% → 49%\u003c/text>\u003crect x='20' y='190' width='680' height='80' rx='10' fill='#f5f5f5' stroke='#9e9e9e' stroke-width='1'/>\u003ctext x='360' y='220' text-anchor='middle' font-size='14' font-weight='bold' fill='#333'>因果链说明\u003c/text>\u003ctext x='360' y='245' text-anchor='middle' font-size='13' fill='#333'>减少步骤 → 降低认知负荷 → 减少中途放弃 → 更多用户完成首次有效任务\u003c/text>\u003crect x='20' y='290' width='680' height='60' rx='10' fill='#fff9c4' stroke='#f9a825' stroke-width='1'/>\u003ctext x='360' y='315' text-anchor='middle' font-size='13' fill='#333'>⚠ 所有数据均为合成资料，仅用于演示教学\u003c/text>\u003ctext x='360' y='335' text-anchor='middle' font-size='13' fill='#333'>激活定义：用户完成首次有效任务\u003c/text>\u003c/svg>","anchors":[{"id":"main","x":80,"y":140,"width":720,"height":400}],"steps":[{"id":"step1","title":"识别主要流失点","explanation":"研究样本显示首次设置流程是主要流失点，用户在此阶段流失最多。该发现基于合成资料S3。","anchorIds":["main"],"claimIds":["claim1"]},{"id":"step2","title":"定义激活标准","explanation":"团队将激活定义为用户完成首次有效任务，为衡量优化效果提供明确标准。该定义来自合成资料S4。","anchorIds":["main"],"claimIds":["claim4"]},{"id":"step3","title":"优化引导步骤","explanation":"团队将引导步骤从7步减少到4步，以简化首次设置流程，降低用户完成障碍。该措施基于合成资料S6。","anchorIds":["main"],"claimIds":["claim2"]},{"id":"step4","title":"激活率提升","explanation":"通过引导步骤优化，激活率从合成基线42%提升至实验组49%，验证了减少步骤的有效性。该结果基于合成资料S5。","anchorIds":["main"],"claimIds":["claim3"]}],"bindings":[{"claimId":"claim1","snapshotId":"a43c2c67-3362-4995-99cc-7a4cb9708c99:course","evidenceMarkers":["S3"],"kind":"source","statement":"首次设置流程是主要流失点。"},{"claimId":"claim2","snapshotId":"a43c2c67-3362-4995-99cc-7a4cb9708c99:course","evidenceMarkers":["S6"],"kind":"source","statement":"引导步骤从7步减少到4步。"},{"claimId":"claim3","snapshotId":"a43c2c67-3362-4995-99cc-7a4cb9708c99:course","evidenceMarkers":["S5"],"kind":"source","statement":"激活率从42%提升至49%。"},{"claimId":"claim4","snapshotId":"a43c2c67-3362-4995-99cc-7a4cb9708c99:course","evidenceMarkers":["S4"],"kind":"source","statement":"激活定义为用户完成首次有效任务。"}]},{"id":"pg_perf","order":3,"chapterId":"ch3","role":"content","purpose":"explain","title":"性能与使用模式改善","conclusion":"本季度性能优化显著：应用启动时间缩短 18%，使用频率提升，同时激活率与留存率的改善同步验证了更顺畅的用户体验。","visualKind":"chart","bodyHtml":"\u003csvg data-anchor-id='main' viewBox='0 0 1280 720' xmlns='http://www.w3.org/2000/svg' role='img' aria-labelledby='svgTitle svgDesc'>\u003ctitle id='svgTitle'>性能与使用模式改善（合成数据）\u003c/title>\u003cdesc id='svgDesc'>图表展示四个关键指标变化：启动时间-18%，使用频率+22%，激活率+7%（42%至49%），次周留存+4%（31%至35%）。\u003c/desc>\u003crect x='80' y='140' width='720' height='400' fill='#f8f8f8' rx='8'/>\u003ctext x='440' y='180' font-size='28' text-anchor='middle' fill='#333'>性能与使用模式改善（合成数据）\u003c/text>\u003cg transform='translate(120,220)'>\u003crect x='0' y='0' width='120' height='40' fill='#4a90d9'/>\u003ctext x='60' y='26' font-size='18' text-anchor='middle' fill='white'>启动时间\u003c/text>\u003crect x='140' y='120' width='120' height='40' fill='#5cad5c'/>\u003ctext x='200' y='146' font-size='18' text-anchor='middle' fill='white'>使用频率\u003c/text>\u003crect x='280' y='40' width='120' height='40' fill='#e88b3a'/>\u003ctext x='340' y='66' font-size='18' text-anchor='middle' fill='white'>激活率\u003c/text>\u003crect x='420' y='160' width='120' height='40' fill='#9b59b6'/>\u003ctext x='480' y='186' font-size='18' text-anchor='middle' fill='white'>次周留存\u003c/text>\u003c/g>\u003cg transform='translate(120,300)'>\u003crect x='0' y='0' width='120' height='80' fill='#4a90d9' fill-opacity='0.3'/>\u003ctext x='60' y='45' font-size='18' text-anchor='middle'>-18%\u003c/text>\u003ctext x='60' y='70' font-size='14' text-anchor='middle'>启动时间\u003c/text>\u003crect x='140' y='0' width='120' height='80' fill='#5cad5c' fill-opacity='0.3'/>\u003ctext x='200' y='45' font-size='18' text-anchor='middle'>+22%\u003c/text>\u003ctext x='200' y='70' font-size='14' text-anchor='middle'>使用频率\u003c/text>\u003crect x='280' y='0' width='120' height='80' fill='#e88b3a' fill-opacity='0.3'/>\u003ctext x='340' y='45' font-size='18' text-anchor='middle'>+7%\u003c/text>\u003ctext x='340' y='70' font-size='14' text-anchor='middle'>激活率\u003c/text>\u003crect x='420' y='0' width='120' height='80' fill='#9b59b6' fill-opacity='0.3'/>\u003ctext x='480' y='45' font-size='18' text-anchor='middle'>+4%\u003c/text>\u003ctext x='480' y='70' font-size='14' text-anchor='middle'>次周留存\u003c/text>\u003c/g>\u003c/svg>","anchors":[{"id":"main","x":80,"y":140,"width":720,"height":400}],"steps":[{"id":"step-perf-overview","title":"性能指标总览","explanation":"图表展示了本季度四个关键性能与使用指标的变化比率，全部为合成数据。启动时间缩短 18% 是基础设施优化的直接成果；使用频率提升 22% 表明性能提升带来了更高的用户粘性；激活率与次周留存的增长进一步验证了体验改善的良性循环。","anchorIds":["main"],"claimIds":["claim-perf-overview"]},{"id":"step-perf-detail","title":"指标拆解","explanation":"启动时间缩短至 1.2 秒（目标 1.5 秒），主要得益于代码拆分与缓存策略。使用频率提升 22% 是因为性能提升减少了用户等待时间，从而提高使用意愿。激活率与次周留存的变化与引导步骤减少相关，但性能改善也提供了支撑。","anchorIds":["main"],"claimIds":["claim-perf-detail"]}],"bindings":[{"claimId":"claim-perf-overview","snapshotId":"a43c2c67-3362-4995-99cc-7a4cb9708c99:course","evidenceMarkers":["S5","S6","S7"],"kind":"derived","statement":"性能与使用模式改善的四个核心指标变化均为合成数据，源于产品优化措施。"},{"claimId":"claim-perf-detail","snapshotId":"a43c2c67-3362-4995-99cc-7a4cb9708c99:course","evidenceMarkers":["S5","S6","S7"],"kind":"derived","statement":"具体指标数值：激活率从 42% 提升至 49%，引导步骤从 7 步减至 4 步，周活跃用户从 8.2 万增至 9.6 万，次周留存从 31% 提升至 35%。"}]},{"id":"pg_risk","order":4,"chapterId":"ch4","role":"content","purpose":"review","title":"主要风险与应对方案","conclusion":"本季度核心改进已见效，但跨端同步一致性与历史数据迁移构成下一季度主要风险，需通过灰度发布与迁移前校验进行缓解。","visualKind":"diagram","bodyHtml":"\u003csvg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"风险与应对关系图\" data-anchor-id=\"main\">\n  \u003crect x=\"40\" y=\"30\" width=\"280\" height=\"80\" rx=\"10\" fill=\"#E8F0FE\" stroke=\"#1A73E8\" stroke-width=\"2\"/>\n  \u003ctext x=\"180\" y=\"65\" text-anchor=\"middle\" font-size=\"18\" fill=\"#1A73E8\" font-weight=\"bold\">跨端状态同步延迟\u003c/text>\n  \u003ctext x=\"180\" y=\"95\" text-anchor=\"middle\" font-size=\"14\" fill=\"#333\">数据一致性受损\u003c/text>\n  \u003crect x=\"400\" y=\"30\" width=\"280\" height=\"80\" rx=\"10\" fill=\"#E8F0FE\" stroke=\"#1A73E8\" stroke-width=\"2\"/>\n  \u003ctext x=\"540\" y=\"65\" text-anchor=\"middle\" font-size=\"18\" fill=\"#1A73E8\" font-weight=\"bold\">历史数据迁移复杂度\u003c/text>\n  \u003ctext x=\"540\" y=\"95\" text-anchor=\"middle\" font-size=\"14\" fill=\"#333\">迁移中断与丢失风险\u003c/text>\n  \u003cline x1=\"320\" y1=\"70\" x2=\"400\" y2=\"70\" stroke=\"#B0BEC5\" stroke-width=\"2\" stroke-dasharray=\"6,4\"/>\n  \u003ctext x=\"360\" y=\"60\" text-anchor=\"middle\" font-size=\"12\" fill=\"#666\">相互影响\u003c/text>\n  \u003crect x=\"40\" y=\"180\" width=\"580\" height=\"100\" rx=\"10\" fill=\"#FFF9C4\" stroke=\"#F9A825\" stroke-width=\"2\"/>\n  \u003ctext x=\"80\" y=\"215\" font-size=\"16\" fill=\"#F57F17\" font-weight=\"bold\">应对方案\u003c/text>\n  \u003ctext x=\"80\" y=\"245\" font-size=\"14\" fill=\"#333\">1. 灰度发布，逐步放量，实时监控同步队列\u003c/text>\n  \u003ctext x=\"80\" y=\"270\" font-size=\"14\" fill=\"#333\">2. 迁移前校验，备份回滚，双写验证\u003c/text>\n  \u003cline x1=\"180\" y1=\"110\" x2=\"180\" y2=\"180\" stroke=\"#B0BEC5\" stroke-width=\"2\" stroke-dasharray=\"4,4\"/>\n  \u003cline x1=\"540\" y1=\"110\" x2=\"540\" y2=\"180\" stroke=\"#B0BEC5\" stroke-width=\"2\" stroke-dasharray=\"4,4\"/>\n\u003c/svg>","anchors":[{"id":"main","x":80,"y":140,"width":720,"height":400}],"steps":[{"id":"step-risks","title":"识别主要风险","explanation":"本季度改进带来积极效果，但跨端状态同步仍存在可见延迟，同时历史数据迁移复杂度高，两者为下一季度主要风险。","anchorIds":["main"],"claimIds":["claim-1"]},{"id":"step-mitigation","title":"提出应对方案","explanation":"针对同步一致性与迁移风险，采用灰度发布与迁移前校验的方式，降低发布影响并保障数据安全。","anchorIds":["main"],"claimIds":["claim-2","claim-3"]}],"bindings":[{"claimId":"claim-1","snapshotId":"a43c2c67-3362-4995-99cc-7a4cb9708c99:ch4","evidenceMarkers":["S12"],"kind":"source","statement":"跨端状态同步仍存在可见延迟；同步一致性和历史数据迁移是下一季度主要风险。"},{"claimId":"claim-2","snapshotId":"a43c2c67-3362-4995-99cc-7a4cb9708c99:ch4","evidenceMarkers":["S12"],"kind":"derived","statement":"同步一致性与历史数据迁移风险相互关联，共同影响系统稳定性。"},{"claimId":"claim-3","snapshotId":"a43c2c67-3362-4995-99cc-7a4cb9708c99:ch4","evidenceMarkers":["S14"],"kind":"source","statement":"风险缓解方案包括灰度发布和迁移前校验。"}]},{"id":"pg_next","order":5,"chapterId":"ch4","role":"content","purpose":"review","title":"下一步计划","conclusion":"下一季度优先修复同步一致性，并扩大批量处理覆盖，以降低风险并持续增长。","visualKind":"diagram","bodyHtml":"\u003cdiv data-anchor-id='main'>\n  \u003csvg viewBox='0 0 720 400' xmlns='http://www.w3.org/2000/svg' role='img' aria-label='下一步计划优先级图'>\n    \u003crect x='40' y='30' width='300' height='150' rx='10' fill='#E8F0FE' stroke='#1A73E8' stroke-width='2'/>\n    \u003ctext x='190' y='70' text-anchor='middle' font-size='16' fill='#1A73E8' font-weight='bold'>P0 同步一致性\u003c/text>\n    \u003ctext x='190' y='100' text-anchor='middle' font-size='13' fill='#333'>修复跨端同步延迟\u003c/text>\n    \u003ctext x='190' y='125' text-anchor='middle' font-size='13' fill='#333'>灰度发布 + 迁移前校验\u003c/text>\n    \u003crect x='380' y='30' width='300' height='150' rx='10' fill='#FFF7E6' stroke='#F9AB00' stroke-width='2'/>\n function render(){const s=deck.slides[page];step=-1;camera.innerHTML='<article class="slide" data-page-id="'+esc(s.id)+'"><h1>'+esc(s.title)+'</h1><div class="conclusion">'+esc(s.conclusion)+'</div><div class="slide-body">'+s.bodyHtml+'</div></article>';progress.textContent=(page+1)+' / '+deck.slides.length+' · '+s.title;reset();notes.classList.remove('open');document.title=s.title+' — '+deck.title}
function reset(){panX=panY=0;zoom=1;interaction.style.transform='';spatial.style.transform='';camera.style.transform=''}
function focus(index){const s=deck.slides[page];if(!s.steps.length)return;step=Number.isInteger(index)?index:(step+1)%s.steps.length;const item=s.steps[step],slide=camera.querySelector('.slide');noteContent.innerHTML='<h2>'+esc(item.title)+'</h2><p>'+esc(item.explanation)+'</p>'+item.claimIds.map(id=>'<button class="cite" data-claim="'+esc(id)+'">查看依据：'+esc(claims(s).get(id)?.statement||id)+'</button>').join('<br>');notes.classList.add('open');const targets=item.anchorIds.map(id=>[...slide.querySelectorAll('[data-anchor-id]')].find(el=>el.getAttribute('data-anchor-id')===id)).filter(Boolean);if(!targets.length)return;spatial.style.transform='rotateY('+(step%2?'-.8':'.8')+'deg) translateZ(6px)';camera.style.transition='none';camera.style.transform='';camera.getBoundingClientRect();const vr=viewport.getBoundingClientRect(),nr=notes.getBoundingClientRect(),safe={left:vr.left+24,top:vr.top+24,right:Math.min(vr.right-24,nr.left-18),bottom:vr.bottom-24},fs=fit.getBoundingClientRect().width/1280,center={x:(vr.left+vr.right)/2,y:(vr.top+vr.bottom)/2};let z=1,tx=0,ty=0;const bounds=()=>{const rs=targets.map(el=>el.getBoundingClientRect());return{left:Math.min(...rs.map(r=>r.left)),top:Math.min(...rs.map(r=>r.top)),right:Math.max(...rs.map(r=>r.right)),bottom:Math.max(...rs.map(r=>r.bottom))}};let r=bounds();z=Math.min(2.4,(safe.right-safe.left-32)/(r.right-r.left),(safe.bottom-safe.top-32)/(r.bottom-r.top));z=Math.max(.25,z);const desired={x:(safe.left+safe.right)/2,y:(safe.top+safe.bottom)/2},tc={x:(r.left+r.right)/2,y:(r.top+r.bottom)/2};tx=(desired.x-center.x-z*(tc.x-center.x))/fs;ty=(desired.y-center.y-z*(tc.y-center.y))/fs;const apply=()=>{camera.style.transform='translate('+tx+'px,'+ty+'px) scale('+z+')';camera.getBoundingClientRect()};for(let i=0;i<4;i++){apply();r=bounds();const factor=Math.min(1,(safe.right-safe.left-16)/(r.right-r.left),(safe.bottom-safe.top-16)/(r.bottom-r.top));if(factor<1)z*=factor*.98;tx+=(desired.x-(r.left+r.right)/2)/fs;ty+=(desired.y-(r.top+r.bottom)/2)/fs}apply();const final=camera.style.transform;camera.style.transform='';camera.getBoundingClientRect();camera.style.transition='';requestAnimationFrame(()=>{camera.style.transform=final;setTimeout(()=>{camera.style.transition='none';for(let i=0;i<2;i++){r=bounds();if(r.left>=safe.left&&r.right<=safe.right&&r.top>=safe.top&&r.bottom<=safe.bottom)break;const factor=Math.min(1,(safe.right-safe.left-12)/(r.right-r.left),(safe.bottom-safe.top-12)/(r.bottom-r.top));z*=factor*.97;tx+=(desired.x-(r.left+r.right)/2)/fs;ty+=(desired.y-(r.top+r.bottom)/2)/fs;apply()}camera.style.transition=''},650)})}
function cite(id){const s=deck.slides[page],binding=claims(s).get(id);if(!binding)return;const snapshot=deck.evidence.find(x=>x.id===binding.snapshotId),items=snapshot?snapshot.items.filter(x=>binding.evidenceMarkers.includes(x.marker)):[];noteContent.innerHTML='<h2>'+esc(binding.statement)+'</h2>'+(binding.kind==='teaching-example'?'<p>教学示例数据，不代表实测结果。</p>':items.map(x=>'<div class="source"><strong>'+esc(x.title)+'</strong><p>'+esc(x.excerpt)+'</p><small>'+esc(x.sourceVersion)+' · '+esc(x.chunkId)+'</small>'+(x.url?'<br><a target="_blank" rel="noopener noreferrer" href="'+esc(x.url)+'">打开原始来源</a>':'')+'</div>').join(''));notes.classList.add('open')}
function go(delta){page=Math.max(0,Math.min(deck.slides.length-1,page+delta));render()}
document.getElementById('prev').onclick=()=>go(-1);document.getElementById('next').onclick=()=>go(1);document.getElementById('step').onclick=()=>focus();document.getElementById('reset').onclick=reset;document.getElementById('close-cite').onclick=()=>notes.classList.remove('open');noteContent.onclick=e=>{const button=e.target.closest('[data-claim]');if(button)cite(button.dataset.claim)};
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(-1)}else if(e.key===' '||e.key==='Enter'){e.preventDefault();focus()}else if(e.key==='Escape')notes.classList.remove('open')});
viewport.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.5,Math.min(3,zoom*Math.exp(-e.deltaY*.001)));interaction.style.transform='translate('+panX+'px,'+panY+'px) scale('+zoom+')'},{passive:false});viewport.addEventListener('pointerdown',e=>{if(e.target.closest('button,a,#notes'))return;drag={x:e.clientX,y:e.clientY,panX,panY};clickStart={x:e.clientX,y:e.clientY};viewport.setPointerCapture(e.pointerId)});viewport.addEventListener('pointermove',e=>{if(!drag)return;panX=drag.panX+(e.clientX-drag.x)/Math.max(.1,Math.min(innerWidth/1280,innerHeight/720));panY=drag.panY+(e.clientY-drag.y)/Math.max(.1,Math.min(innerWidth/1280,innerHeight/720));interaction.style.transform='translate('+panX+'px,'+panY+'px) scale('+zoom+')'});viewport.addEventListener('pointerup',e=>{if(drag&&clickStart&&Math.hypot(e.clientX-clickStart.x,e.clientY-clickStart.y)<8)go(e.clientX<innerWidth/2?-1:1);drag=null;clickStart=null});viewport.ondblclick=reset;addEventListener('resize',resize);resize();render()})();
</script></body></html>
