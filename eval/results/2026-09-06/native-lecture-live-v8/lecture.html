<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zoom Lecture</title>
<style>
:root{
  color-scheme:light;
  --paper:#fbfaf7;--canvas:#f2f0ea;--outside:#ffffff;--surface:#ffffff;--sunken:#f4f2ec;
  --ink-1:#23231f;--ink-2:#5f5e5a;--ink-3:#8a8880;
  --rule:rgba(35,35,31,.14);--rule-strong:rgba(35,35,31,.30);
  --accent:#534ab7;--accent-soft:#eeedfe;
  --guide:#2457a6;--guide-2:#194887;--guide-ink:#f7fbff;--guide-muted:#dce9fb;
  --font-serif:"Songti SC","Source Han Serif SC","Noto Serif SC","SimSun",Georgia,"Times New Roman",serif;
  --font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans SC","Segoe UI",Roboto,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--outside);color:var(--ink-1);font-family:var(--font-sans)}
body{user-select:none}
.runtime{position:relative;width:100%;height:100%;overflow:hidden;background:var(--outside)}
.viewport{position:absolute;inset:0;overflow:hidden;perspective:1500px;perspective-origin:50% 48%;isolation:isolate;background:var(--outside)}
.fit-layer{
  position:absolute;left:50%;top:50%;width:1280px;height:720px;
  transform-origin:50% 50%;transform:translate(-50%,-50%) scale(var(--fit,1));
  transform-style:preserve-3d;will-change:transform;
}
.interaction-layer{
  position:absolute;inset:0;width:1280px;height:720px;transform-origin:50% 50%;
  transform-style:preserve-3d;will-change:transform;
  transform:translate3d(0,0,0) scale(1) rotateX(0deg) rotateY(0deg);
}
.spatial-layer{
  position:absolute;inset:0;width:1280px;height:720px;transform-origin:50% 50%;
  transform-style:preserve-3d;will-change:transform;
  transform:translate3d(0,0,0) rotateX(0deg) rotateY(0deg) rotateZ(0deg);
}
.camera{
  position:absolute;inset:0;width:1280px;height:720px;transform-origin:0 0;
  transform-style:preserve-3d;transform:translate3d(0,0,0) scale(1);will-change:transform;
}
.slide-frame{
  position:absolute;inset:0;width:1280px;height:720px;border:0;background:var(--paper);
  backface-visibility:hidden;transform:translateZ(0);
  box-shadow:0 20px 58px rgba(35,35,31,.13),0 2px 10px rgba(35,35,31,.06);
}
.highlight-layer{position:absolute;inset:0;width:1280px;height:720px;pointer-events:none;transform:translateZ(2px)}
.anchor-highlight{
  position:absolute;border:2px solid var(--accent);border-radius:8px;
  box-shadow:0 0 0 1px rgba(251,250,247,.72) inset;
  opacity:0;transition:opacity 260ms ease;
}
.anchor-highlight.on{opacity:1}
.anchor-highlight.spotlight{box-shadow:0 0 0 2200px rgba(35,35,31,.34),0 0 0 1px rgba(251,250,247,.72) inset}
.interaction-surface{position:absolute;z-index:12;inset:0;cursor:grab;touch-action:none;outline:none}
.interaction-surface.dragging{cursor:grabbing}

.panel{
  position:absolute;z-index:20;width:400px;max-height:min(590px,calc(100vh - 48px));
  background:rgba(251,250,247,.988);border:.5px solid rgba(35,35,31,.22);border-radius:12px;
  box-shadow:0 22px 60px rgba(35,35,31,.15);overflow:hidden;
  opacity:0;transform:translateY(10px) scale(.985);pointer-events:none;
  transition:opacity 260ms ease,transform 520ms var(--ease),left 760ms var(--ease),right 760ms var(--ease),top 760ms var(--ease),bottom 760ms var(--ease);
}
.panel.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.panel[data-place="right"]{right:28px;top:50%;transform:translateY(calc(-50% + 10px)) scale(.985)}
.panel[data-place="right"].show{transform:translateY(-50%) scale(1)}
.panel[data-place="left"]{left:28px;top:50%;transform:translateY(calc(-50% + 10px)) scale(.985)}
.panel[data-place="left"].show{transform:translateY(-50%) scale(1)}
.panel[data-place="bottom"]{left:50%;bottom:24px;transform:translate(-50%,10px) scale(.985)}
.panel[data-place="bottom"].show{transform:translate(-50%,0) scale(1)}
.panel[data-place="top"]{left:50%;top:24px;transform:translate(-50%,-10px) scale(.985)}
.panel[data-place="top"].show{transform:translate(-50%,0) scale(1)}
.panel-head{padding:20px 22px 15px;border-bottom:.5px solid var(--rule);background:rgba(255,255,255,.52)}
.panel-eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:9px;font:400 11px/1.3 var(--font-mono);letter-spacing:.07em;color:var(--ink-3)}
.panel-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.panel-title{margin:0;font:500 22px/1.36 var(--font-serif);color:var(--ink-1)}
.panel-body{padding:18px 22px 21px;max-height:455px;overflow:auto;font:400 16px/1.82 var(--font-sans);color:var(--ink-1);user-select:text}
.panel-body p{margin:0 0 12px}.panel-body p:last-child{margin-bottom:0}
.panel-body ul,.panel-body ol{margin:7px 0 12px;padding-left:1.25em}.panel-body li{margin:4px 0}
.panel-body blockquote{margin:10px 0;padding-left:12px;border-left:2px solid var(--accent);color:var(--ink-2)}
.panel-body hr{border:0;border-top:.5px solid var(--rule);margin:14px 0}
.panel-body code{font:400 .94em/1.6 var(--font-mono);padding:1px 5px;border-radius:4px;background:var(--sunken);color:#3c3489}
.panel-body strong{font-weight:500;color:#332b78}.panel-body em{color:var(--ink-2)}
.panel-body a{color:var(--accent);text-underline-offset:3px}
.reveal-token{display:inline;opacity:0;filter:blur(2px);transform:translateY(5px);animation:tokenIn 300ms var(--ease) forwards}
@keyframes tokenIn{to{opacity:1;filter:blur(0);transform:translateY(0)}}

.onboarding{
  position:absolute;z-index:60;right:24px;top:24px;width:min(318px,calc(100vw - 32px));
  background:var(--guide);color:var(--guide-ink);border:1px solid rgba(255,255,255,.16);border-radius:12px;
  box-shadow:0 18px 48px rgba(25,58,109,.20);overflow:hidden;
  opacity:0;transform:translateY(-8px) scale(.99);pointer-events:none;
  transition:opacity 220ms ease,transform 420ms var(--ease);
}
.onboarding.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.onboarding-head{display:flex;align-items:center;justify-content:space-between;padding:15px 17px 11px;border-bottom:1px solid rgba(255,255,255,.14)}
.onboarding-title{margin:0;font:500 16px/1.2 var(--font-sans);letter-spacing:.01em;color:#fff}
.onboarding-body{padding:12px 17px 13px;display:grid;gap:9px;font:400 13px/1.35 var(--font-sans);color:var(--guide-ink)}
.guide-row{display:grid;grid-template-columns:106px 1fr;align-items:center;gap:12px}
.guide-key{font:500 11px/1.2 var(--font-mono);color:#fff;white-space:nowrap}
.guide-action{color:var(--guide-muted)}
.onboarding-actions{display:flex;justify-content:flex-end;padding:0 17px 15px}
.onboarding-btn{border:1px solid rgba(255,255,255,.28);border-radius:7px;background:#fff;color:var(--guide-2);padding:8px 13px;font:500 12px/1 var(--font-sans);cursor:pointer}
.onboarding-btn:hover{background:#f4f8ff}
.geometry-probe-fit{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:50% 50%;transform:translate(-50%,-50%) scale(var(--fit,1));transform-style:preserve-3d;opacity:0;pointer-events:none;z-index:-1}
.geometry-probe-spatial{position:absolute;inset:0;width:1280px;height:720px;transform-origin:50% 50%;transform-style:preserve-3d}
.geometry-probe-camera{position:absolute;inset:0;width:1280px;height:720px;transform-origin:0 0;transform-style:preserve-3d}
.geometry-probe-anchor{position:absolute;pointer-events:none;transform:translateZ(2px)}

@media (max-width:700px){.panel{left:16px!important;right:16px!important;width:auto!important;max-width:none;top:auto!important;bottom:16px!important;transform:translateY(10px) scale(.985)!important}.panel.show{transform:translateY(0) scale(1)!important}.onboarding{right:20px;top:20px}}
@media (prefers-reduced-motion:reduce){.interaction-layer,.camera,.panel,.anchor-highlight,.onboarding{transition:none!important}.reveal-token{opacity:1!important;filter:none!important;transform:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="runtime" id="app">
  <div class="viewport" id="viewport">
    <div class="fit-layer" id="fitLayer">
      <div class="interaction-layer" id="interactionLayer">
        <div class="spatial-layer" id="spatialLayer">
          <div class="camera" id="camera">
            <iframe class="slide-frame" id="frame" title="lecture slide"></iframe>
            <div class="highlight-layer" id="highlights"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="interaction-surface" id="interactionSurface" aria-label="讲解画布：滚轮缩放，左键拖拽，双击复位，方向键切换" tabindex="0"></div>
    <aside class="panel" id="panel" data-place="right" aria-live="polite">

      <div class="onboarding-actions"><button class="onboarding-btn" id="onboardingBtn" type="button">开始</button></div>
    </aside>
    <div class="geometry-probe-fit" id="probeFit" aria-hidden="true">
      <div class="geometry-probe-spatial" id="probeSpatial">
        <div class="geometry-probe-camera" id="probeCamera"><div class="geometry-probe-anchor" id="probeAnchor"></div></div>
      </div>
    </div>
  </div>
</div>

l='#cc0000'>首次设置流失\u003c/text>\u003ctext class=\"t\" x='130' y='125' text-anchor='middle' font-size='12' fill='#333'>主要流失点\u003c/text>\u003crect x='300' y='80' width='200' height='60' rx='8' fill='#ccffcc' stroke='#008800'/>\u003ctext class=\"t\" x='400' y='105' text-anchor='middle' font-size='14' font-weight='bold' fill='#008800'>简化引导\u003c/text>\u003ctext class=\"t\" x='400' y='125' text-anchor='middle' font-size='12' fill='#333'>7步 → 4步\u003c/text>\u003crect x='560' y='80' width='140' height='60' rx='8' fill='#cce5ff' stroke='#0066cc'/>\u003ctext class=\"t\" x='630' y='105' text-anchor='middle' font-size='14' font-weight='bold' fill='#0066cc'>激活率提升\u003c/text>\u003ctext class=\"t\" x='630' y='125' text-anchor='middle' font-size='12' fill='#333'>42% → 49%\u003c/text>\u003cline x1='230' y1='110' x2='290' y2='110' stroke='#444' stroke-width='2' marker-end='url(#arrow)'/>\u003cline x1='500' y1='110' x2='550' y2='110' stroke='#444' stroke-width='2' marker-end='url(#arrow)'/>\u003ctext class=\"t\" x='260' y='95' text-anchor='middle' font-size='11' fill='#666'>改进\u003c/text>\u003ctext class=\"t\" x='525' y='95' text-anchor='middle' font-size='11' fill='#666'>导致\u003c/text>\u003crect x='30' y='180' width='300' height='70' rx='8' fill='#e6f7ff' stroke='#0099cc'/>\u003ctext class=\"t\" x='180' y='205' text-anchor='middle' font-size='13' font-weight='bold' fill='#006699'>次周留存 31% → 35%\u003c/text>\u003ctext class=\"t\" x='180' y='225' text-anchor='middle' font-size='12' fill='#333'>周活跃用户 8.2万 → 9.6万\u003c/text>\u003ctext class=\"t\" x='180' y='245' text-anchor='middle' font-size='11' fill='#666'>合成数据\u003c/text>\u003crect x='390' y='180' width='300' height='70' rx='8' fill='#fff3cc' stroke='#cc8800'/>\u003ctext class=\"t\" x='540' y='205' text-anchor='middle' font-size='13' font-weight='bold' fill='#996600'>因果链\u003c/text>\u003ctext class=\"t\" x='540' y='225' text-anchor='middle' font-size='12' fill='#333'>减少步骤 → 降低流失\u003c/text>\u003ctext class=\"t\" x='540' y='245' text-anchor='middle' font-size='12' fill='#333'>提升激活 → 带动留存\u003c/text>\u003c/svg>\u003c/div>\u003ci class=\"anchor\" data-anchor=\"main\" data-rect=\"80 140 720 400\" style=\"left:80px;top:140px;width:720px;height:400px\">\u003c/i>\u003cdiv class=\"footer\">2026 Q3 产品复盘\u003cspan class=\"page\">02\u003c/span>\u003c/div>\u003c/main>\u003c/body>\u003c/html>","slides/s03.html":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cstyle>\n:root{--paper:#fbfaf7;--surface:#fff;--sunken:#f4f2ec;--ink-1:#23231f;--ink-2:#5f5e5a;--ink-3:#8a8880;--rule:rgba(35,35,31,.14);--rule-strong:rgba(35,35,31,.30);--accent:#534ab7;--font-serif:\"Songti SC\",\"Source Han Serif SC\",\"Noto Serif SC\",\"SimSun\",Georgia,\"Times New Roman\",serif;--font-sans:-apple-system,BlinkMacSystemFont,\"PingFang SC\",\"Microsoft YaHei\",\"Source Han Sans SC\",\"Noto Sans SC\",\"Segoe UI\",Roboto,sans-serif;--font-mono:ui-monospace,SFMono-Regular,\"SF Mono\",Menlo,Consolas,monospace}\n*{box-sizing:border-box}html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:var(--paper);color:var(--ink-1);font-family:var(--font-sans)}.slide{position:relative;width:1280px;height:720px;overflow:hidden;background:var(--paper)}.eyebrow{position:absolute;z-index:2;left:64px;top:48px;font:400 14px/1.4 var(--font-mono);letter-spacing:.08em;color:var(--ink-3)}h1{position:absolute;z-index:2;left:64px;top:72px;width:1100px;margin:0;font:500 38px/1.24 var(--font-serif)}.opening h1{top:214px;width:900px;font-size:58px;line-height:1.18}.closing h1{top:230px;width:900px;font-size:50px}.visual{position:absolute}.visual>svg{display:block;width:100%;height:100%;max-width:100%;max-height:100%}svg text{fill:var(--ink-1)!important;font-family:var(--font-sans)!important;font-weight:400!important}.t,.ts,.tn{font-weight:400!important}.th{font-weight:500!important}.anchor{position:absolute;pointer-events:none}.footer{position:absolute;z-index:2;left:64px;right:64px;bottom:44px;padding-to const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function renderMarkdown(md){
 const lines=String(md??'').replace(/\r/g,'').split('\n');let out=[],para=[],list=null;
 const flushPara=()=>{if(para.length){out.push('<p>'+inlineMd(para.join(' '))+'</p>');para=[]}};
 const flushList=()=>{if(list){out.push(`<${list.type}>`+list.items.map(v=>'<li>'+inlineMd(v)+'</li>').join('')+`</${list.type}>`);list=null}};

  if(!line.trim()){flushPara();flushList();continue}
  if(/^---+$/.test(line.trim())){flushPara();flushList();out.push('<hr>');continue}
  const ul=line.match(/^\s*[-*]\s+(.+)/),ol=line.match(/^\s*\d+[.)]\s+(.+)/),quote=line.match(/^>\s?(.+)/),head=line.match(/^#{1,3}\s+(.+)/);
  if(ul||ol){flushPara();const type=ul?'ul':'ol',val=(ul||ol)[1];if(!list||list.type!==type){flushList();list={type,items:[]}}list.items.push(val);continue}
  if(quote){flushPara();flushList();out.push('<blockquote>'+inlineMd(quote[1])+'</blockquote>');continue}
  if(head){flushPara();flushList();out.push('<p><strong>'+inlineMd(head[1])+'</strong></p>');continue}

}
function animateText(root){

 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.nodeValue.trim()?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT});
 const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);let parts=[];
 for(const n of nodes){const text=n.nodeValue;let segs;try{segs=[...new Intl.Segmenter('zh-CN',{granularity:'word'}).segment(text)].map(x=>x.segment)}catch(e){segs=text.split(/(?<=\s)|(?=\s)/)}parts.push({n,segs})}

function anchorsById(slide){return Object.fromEntries((slide.anchors||[]).map(a=>[a.id,a]));}

 const anchors=anchorsById(slide),anchor=anchors[step.camera.anchorId];if(!anchor)return{s:1,cx:.5,cy:.5};
 const r=anchor.rect,dc=lecture.defaults?.camera||{},pad=step.camera.padding??dc.padding??24;
 let s=step.camera.scale??(step.camera.depth?DEPTH[step.camera.depth]:null)??(dc.depth?DEPTH[dc.depth]:null)??Math.min(W/(r.w+2*pad),H/(r.h+2*pad));

function materializeCamera(cam){return{...cam,tx:cam.tx??(W/2-cam.cx*W*cam.s),ty:cam.ty??(H/2-cam.cy*H*cam.s)};}

function resolvePlacement(step,cam){const p=step.panel?.placement??lecture.defaults?.panel?.placement??'auto';if(p!=='auto')return p;return cam.cx<=.5?'right':'left';}

function updateFit(){const r=viewport.getBoundingClientRect();fit=Math.min(r.width/W,r.height/H);fit=Math.max(.25,fit);fitLayer.style.setProperty('--fit',fit);probeFit.style.setProperty('--fit',fit);if(lecture)renderStep(false);}

function inferPanelSide(panelRect,viewRect){

 let left=vr.left+outer,right=vr.right-outer,top=vr.top+outer,bottom=vr.bottom-outer;

 else if(side==='left')left=Math.max(left,panelRect.right+gap);

}
function focusRectForStep(step,slide){

}
function measureProjectedAnchor(anchor,cam,spatial){

 return probeAnchor.getBoundingClientRect();
}
function overflowAgainst(rect,safe){return{left:Math.max(0,safe.left-rect.left),right:Math.max(0,rect.right-safe.right),top:Math.max(0,safe.top-rect.top),bottom:Math.max(0,rect.bottom-safe.bottom)};}

function preparePanel(step){
 const baseW=step.panel.width??lecture.defaults?.panel?.width??420,screenW=Math.max(340,Math.min(480,baseW*fit));panel.style.width=screenW+'px';
 panelTitle.textContent=step.panel.title||step.title||'讲解';panelBody.innerHTML=renderMarkdown(step.panel.body);panelBody.scrollTop=0;panel.classList.add('show');
}
function chooseProtectedLayout(step,slide,baseCam){
 const anchor=focusRectForStep(step,slide);if(!step.panel||step.kind!=='zoom'||!anchor)return{cam:materializeCamera(baseCam),place:step.panel?resolvePlacement(step,baseCam):'right',spatial:spatialTarget('right',false)};

  panel.dataset.place=place;const panelRect=panel.getBoundingClientRect(),safe=protectedRect(panelRect);if(safe.width<96||safe.height<96)continue;

  if(!best||score>best.score)best={...fitResult,place:actualSide,requestedPlace:place,spatial,score};

function userTransform(v=userView){return `translate3d(${v.panX}px,${v.panY}px,0) scale(${v.scale}) rotateX(${v.pitch}deg) rotateY(${v.yaw}deg)`;}
function applyUserView(animate=false,ms=260){interactionLayer.style.transition=animate?`transform ${ms}ms var(--ease)`:'none';interactionLayer.style.transform=userTransform();}
function resetUserView(animate=true,ms=760){userView={scale:1,panX:0,panY:0,yaw:0,pitch:0};applyUserView(animate,ms);}
function setManualOrientation(){userView.yaw=clamp(userView.panX/92,-5.2,5.2);userView.pitch=clamp(-userView.panY/150,-3.2,3.2);}

function spatialTransform(s){return `translate3d(${s.x}px,${s.y}px,${s.z}px) rotateX(${s.pitch}deg) rotateY(${s.yaw}deg) rotateZ(${s.roll}deg)`;}
function spatialTarget(place,show){
 if(!show)return{x:0,y:0,z:0,yaw:0,pitch:0,roll:0};
 const width=parseFloat(panel.style.width)||400,base=clamp((width/Math.max(fit,.25))*.46+62,112,210);

function setSpatialForStep(step,cam,ms,animate=true,layout=null){const show=!!step.panel&&step.kind==='zoom';const target=layout?.spatial??spatialTarget(step.panel?resolvePlacement(step,cam):'right',show);animateSpatial(target,ms,animate);}

function renderHighlights(step,slide){
 highlights.innerHTML='';if(step.kind!=='zoom')return;const style=step.highlight?.style??lecture.defaults?.highlight?.style??'outline';if(style==='none')return;
 const ids=step.highlight?.anchorIds?.length?step.highlight.anchorIds:[step.camera.anchorId],map=anchorsById(slide);
 ids.forEach(id=>{const a=map[id];if(!a)return;const d=document.createElement('div');d.className='anchor-highlight'+(style==='spotlight'?' spotlight':'');Object.assign(d.style,{left:a.rect.x+'px',top:a.rect.y+'px',width:a.rect.w+'px',height:a.rect.h+'px'});highlights.appendChild(d);requestAnimationFrame(()=>d.classList.add('on'))});
}
function actualHighlightUnion(){

 const left=Math.min(...rects.map(r=>r.left)),top=Math.min(...rects.map(r=>r.top)),right=Math.max(...rects.map(r=>r.right)),bottom=Math.max(...rects.map(r=>r.bottom));return{left,top,right,bottom,width:right-left,height:bottom-top};

function parseBundle(){

}
function slideSource(slide){

async function renderStep(animate=true){

interactionSurface.addEventListener('wheel',e=>{

},{passive:false});

});

async function boot(){

 else{
  const q=new URLSearchParams(location.search),src=q.get('lecture')||'../lecture.json';
  try{const res=await fetch(src,{cache:'no-store'});if(!res.ok)throw new Error(res.status+' '+res.statusText);lecture=await res.json();}
  catch(err){lecture=FALLBACK;console.info('lecture.json unavailable; using built-in demo. Build a standalone artifact to run a real deck directly from file://',err)}

addEventListener('keydown',e=>{
 if(e.key==='Escape'&&onboardingOpen){e.preventDefault();dismissOnboarding();return}
 if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();if(onboardingOpen)dismissOnboarding();go(1)}
 else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();if(onboardingOpen)dismissOnboarding();go(-1)}

addEventListener('resize',updateFit);boot();
})();
